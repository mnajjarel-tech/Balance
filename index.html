<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#173d36" />
  <meta name="description" content="Balance: offline voedings-, activiteits-, trainings- en gewichtstracker." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <title>Balance</title>
  <style>
    :root{--bg:#f5f6f2;--surface:#fff;--surface2:#edf1ec;--text:#17211f;--muted:#68726f;--line:#d8dfdc;--brand:#173d36;--brand2:#2f675b;--accent:#dce9e3;--danger:#9d312f;--warn:#8a611b;--ok:#2d654b;--shadow:0 12px 32px rgba(25,45,39,.08);--r:18px;--safe:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.4}.app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:calc(88px + var(--safe))}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--brand2)}
    header{position:sticky;top:0;z-index:15;background:rgba(245,246,242,.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(216,223,220,.8);padding:14px 16px 10px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;font-size:24px;letter-spacing:-.5px}.date-nav{display:flex;align-items:center;gap:8px}.icon-btn,.ghost-btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 11px;color:var(--text)}.ghost-btn{font-weight:650}.icon-btn:active,.ghost-btn:active,.primary:active,.category-card:active{transform:translateY(1px)}
    main{padding:16px}.section{margin-bottom:20px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px}.section-title h2{font-size:18px;margin:0}.subtle{color:var(--muted);font-size:13px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}.grid{display:grid;gap:12px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
    .hero{background:linear-gradient(145deg,#173d36,#285c50);color:#fff;border:none}.hero .subtle{color:#d5e1dd}.kpi-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}.kpi{background:rgba(255,255,255,.10);padding:10px;border-radius:13px}.kpi strong{display:block;font-size:17px}.progress{height:8px;border-radius:99px;background:#dfe6e2;overflow:hidden}.hero .progress{background:rgba(255,255,255,.18)}.progress>span{display:block;height:100%;background:var(--brand2);border-radius:99px}.hero .progress>span{background:#fff}.metric{display:flex;justify-content:space-between;gap:12px;margin:8px 0}.metric b{font-variant-numeric:tabular-nums}
    .meal-card{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.meal-card h3{margin:0 0 4px;font-size:16px}.meal-card .macro-line{font-size:13px;color:var(--muted)}.meal-add{width:42px;height:42px;border-radius:14px;border:0;background:var(--accent);font-size:24px;color:var(--brand);font-weight:700}
    .bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:20;width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:7px 5px calc(7px + var(--safe))}.nav-btn{border:0;background:transparent;color:var(--muted);padding:6px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}.nav-btn .ico{font-size:21px;line-height:1}.nav-btn.active{color:var(--brand);font-weight:750}.nav-btn.add .ico{background:var(--brand);color:#fff;width:42px;height:42px;display:grid;place-items:center;border-radius:15px;margin-top:-20px;box-shadow:0 8px 18px rgba(23,61,54,.25)}
    .category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.category-card{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:16px;text-align:left;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}.category-card .cat-icon{font-size:31px}.category-card b{font-size:15px}.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;background:var(--accent);color:var(--brand);border-radius:99px;padding:4px 8px;font-weight:700}.badge.warn{background:#fff0d1;color:var(--warn)}.badge.danger{background:#f7dedd;color:var(--danger)}
    .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}.search{flex:1;border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px 13px;min-width:0}.primary{border:0;background:var(--brand);color:#fff;border-radius:14px;padding:12px 16px;font-weight:750}.secondary{border:1px solid var(--line);background:#fff;color:var(--brand);border-radius:14px;padding:11px 14px;font-weight:700}.danger-btn{border:1px solid #e7c4c3;background:#fff4f4;color:var(--danger);border-radius:13px;padding:10px 13px;font-weight:700}
    .product-list{display:grid;gap:9px}.product-row{border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px}.product-head{display:flex;align-items:flex-start;gap:10px}.product-head input[type=checkbox]{width:21px;height:21px;accent-color:var(--brand);margin-top:2px}.product-main{flex:1;min-width:0}.product-main b{display:block}.meta{font-size:12px;color:var(--muted);margin-top:3px}.amount-wrap{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}.amount-wrap input{width:90px;border:1px solid var(--line);border-radius:11px;padding:9px;text-align:right}.conversion-note{font-size:12px;color:var(--brand2);margin-top:5px;background:var(--surface2);padding:7px 9px;border-radius:9px}.sticky-action{position:sticky;bottom:78px;z-index:10;padding:10px 0;background:linear-gradient(to top,var(--bg) 75%,transparent)}
    .cart-line{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.cart-line:last-child{border-bottom:0}.cart-line small{color:var(--muted)}.cart-total{margin-top:12px;padding-top:12px;border-top:2px solid var(--line)}
    .form-grid{display:grid;gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:650}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px}.field textarea{min-height:88px;resize:vertical}.form-actions{display:flex;gap:8px;flex-wrap:wrap}
    .list{display:grid;gap:10px}.list-item{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px}.list-item h3{margin:0 0 4px;font-size:15px}.list-item .row{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pill{font-size:11px;background:var(--surface2);padding:5px 8px;border-radius:99px;color:var(--muted)}
    .svg-chart{width:100%;height:auto;display:block}.chart-label{font-size:10px;fill:#6a7471}.chart-line{fill:none;stroke:#173d36;stroke-width:2.5}.chart-area{fill:rgba(47,103,91,.08)}.chart-grid{stroke:#dfe5e2;stroke-width:1}.empty{text-align:center;padding:28px 16px;color:var(--muted)}.empty .big{font-size:38px;display:block;margin-bottom:8px}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;z-index:50;background:#17211f;color:#fff;padding:11px 15px;border-radius:13px;box-shadow:var(--shadow);max-width:min(90vw,520px);display:none}.toast.show{display:block}.modal-backdrop{position:fixed;inset:0;background:rgba(10,20,17,.42);z-index:40;display:none;align-items:flex-end;justify-content:center}.modal-backdrop.show{display:flex}.modal{background:var(--bg);width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(22px + var(--safe));box-shadow:0 -18px 50px rgba(0,0,0,.18)}.modal-grip{width:44px;height:5px;background:#bdc8c4;border-radius:99px;margin:0 auto 14px}
    .more-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.more-btn{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;min-height:94px}.more-btn .ico{font-size:25px;display:block;margin-bottom:7px}.more-btn b{display:block}.warning-box{background:#fff8e8;border:1px solid #ead8ae;color:#6c4c16;padding:12px;border-radius:13px;font-size:13px}.ok-box{background:#eef7f2;border:1px solid #cfe3d8;color:#285740;padding:12px;border-radius:13px;font-size:13px}.hidden{display:none!important}

    .week-title,.selected-day-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.week-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.week-day{position:relative;border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px 3px;min-width:0;color:var(--text);display:grid;gap:2px;place-items:center}.week-day span{font-size:11px;text-transform:uppercase;color:var(--muted)}.week-day b{font-size:17px}.week-day small{height:17px}.week-day.selected{background:var(--brand);color:#fff;border-color:var(--brand)}.week-day.selected span{color:#dce9e3}.week-day .today-dot{position:absolute;top:4px;right:4px;width:5px;height:5px;background:#e7a53b;border-radius:50%}.fast-toggle{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 11px;font-weight:700}.fast-toggle input{width:21px;height:21px;accent-color:var(--brand)}.fast-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#eef6f2;border:1px solid #cfe0d8;padding:13px;border-radius:15px}.goal-inline{display:flex;gap:7px;flex-wrap:wrap}.goal-inline span{background:var(--surface2);padding:6px 9px;border-radius:99px;font-size:12px}.timeline-row{display:grid;grid-template-columns:48px 32px 1fr;gap:8px;align-items:center}.timeline-row .time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.event-icon{font-size:20px}.planned-note{font-size:12px;color:var(--brand2);margin-top:6px}.water-add{display:grid;grid-template-columns:minmax(88px,1fr) auto 46px;gap:6px;align-items:center;margin-top:10px}.water-add input{width:100%;min-width:0;border:1px solid var(--line);border-radius:11px;padding:10px 8px;text-align:right;font-size:16px}.water-log{margin-top:10px;border-top:1px solid var(--line);padding-top:7px}.water-log>div{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12px;color:var(--muted)}.mini-delete{border:0;background:transparent;color:var(--danger);font-size:20px;padding:0 6px}.week-checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.week-checks label{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px;font-size:12px}.week-checks input{accent-color:var(--brand)}
    @media(min-width:650px){main{padding:20px}.category-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.more-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi-row{gap:12px}}
  .meal-edit-link{margin-top:8px;border:0;background:transparent;color:var(--brand);font-weight:700;padding:4px 0;text-decoration:underline;text-underline-offset:3px}.logged-meal-list{display:grid;gap:8px;margin:12px 0}.logged-edit-row{display:grid;grid-template-columns:minmax(0,1fr) 112px 34px;gap:7px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}.logged-amount{display:flex;align-items:center;gap:4px}.logged-amount input{width:78px;text-align:right}.logged-amount span{font-size:13px;color:var(--muted)}</style>
</head>
<body>
<div class="app" id="app">
  <header><div class="topbar"><div><div class="brand">Balance</div><div class="subtle" id="headerSubtitle">Vandaag</div></div><div id="headerActions"></div></div></header>
  <main id="view"></main>
  <nav class="bottom-nav" aria-label="Hoofdnavigatie">
    <button class="nav-btn" data-route="home"><span class="ico">⌂</span><span>Home</span></button>
    <button class="nav-btn" data-route="agenda"><span class="ico">▦</span><span>Agenda</span></button>
    <button class="nav-btn add" data-route="add"><span class="ico">＋</span><span>Toevoegen</span></button>
    <button class="nav-btn" data-route="weight"><span class="ico">⌁</span><span>Gewicht</span></button>
    <button class="nav-btn" data-route="more"><span class="ico">•••</span><span>Meer</span></button>
  </nav>
</div>
<div class="toast" id="toast"></div>
<div class="modal-backdrop" id="modal"><div class="modal"><div class="modal-grip"></div><div id="modalContent"></div></div></div>
<script src="app.js"></script>
</body>
</html>
